<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق محادثة - تسجيل الدخول</title>
    <style>
        /* نفس التنسيقات السابقة مع إضافة تنسيقات لإدارة جهات الاتصال */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #075e54 0%, #128c7e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }
        
        .login-container h2 {
            color: #075e54;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #075e54;
            font-weight: bold;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #128c7e;
        }
        
        .login-btn {
            background: #128c7e;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
            font-weight: bold;
        }
        
        .login-btn:hover {
            background: #075e54;
        }
        
        .error-message {
            color: #dc3545;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
        
        .admin-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
        
        .admin-toggle {
            color: #128c7e;
            cursor: pointer;
            font-size: 12px;
            text-decoration: underline;
        }
        
        .admin-panel {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
        }
        
        .admin-panel h4 {
            color: #075e54;
            margin-bottom: 10px;
        }
        
        .admin-panel input {
            width: calc(100% - 80px);
            padding: 8px;
            margin-left: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        .admin-panel button {
            background: #075e54;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 5px;
        }
        
        .codes-list, .contacts-list-admin {
            margin-top: 10px;
            text-align: right;
            font-size: 12px;
            color: #666;
            max-height: 150px;
            overflow-y: auto;
        }
        
        .contact-item-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }
        
        .delete-contact {
            background: #dc3545;
            padding: 3px 8px;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>🔐 تطبيق المحادثة</h2>
        <p>الرجاء إدخال رمز الدخول للوصول إلى التطبيق</p>
        
        <div class="input-group">
            <label>رمز الدخول</label>
            <input type="text" id="accessCode" placeholder="أدخل الرمز هنا..." autocomplete="off">
        </div>
        
        <div class="input-group">
            <label>اسم المستخدم</label>
            <input type="text" id="username" placeholder="أدخل اسمك..." autocomplete="off">
        </div>
        
        <button class="login-btn" onclick="verifyCode()">دخول</button>
        
        <div class="error-message" id="errorMessage"></div>
        
        <div class="admin-section">
            <div class="admin-toggle" onclick="toggleAdminPanel()">🔧 لوحة التحكم (للمسؤول)</div>
            <div class="admin-panel" id="adminPanel">
                <h4>🔑 إدارة رموز الدخول</h4>
                <div>
                    <input type="text" id="newCode" placeholder="رمز جديد">
                    <button onclick="addNewCode()">إضافة</button>
                </div>
                <div id="codesList" class="codes-list"></div>
                
                <h4 style="margin-top: 15px;">👥 إدارة جهات الاتصال</h4>
                <div>
                    <input type="text" id="newContactName" placeholder="الاسم">
                    <input type="text" id="newContactPhone" placeholder="رقم الهاتف" style="width: calc(100% - 80px); margin-top: 5px;">
                    <button onclick="addNewContact()" style="margin-top: 5px;">إضافة جهة اتصال</button>
                </div>
                <div id="contactsListAdmin" class="contacts-list-admin"></div>
                
                <button onclick="loadAllData()" style="margin-top: 10px;">تحديث الكل</button>
            </div>
        </div>
    </div>

    <script>
        async function verifyCode() {
            const code = document.getElementById('accessCode').value;
            const username = document.getElementById('username').value;
            const errorDiv = document.getElementById('errorMessage');
            
            if (!code || !username) {
                errorDiv.textContent = 'الرجاء إدخال رمز الدخول واسم المستخدم';
                errorDiv.style.display = 'block';
                return;
            }
            
            try {
                const response = await fetch('/verify-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    sessionStorage.setItem('accessGranted', 'true');
                    sessionStorage.setItem('username', username);
                    sessionStorage.setItem('accessCode', code);
                    window.location.href = '/chat.html';
                } else {
                    errorDiv.textContent = result.message;
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'حدث خطأ في الاتصال بالخادم';
                errorDiv.style.display = 'block';
            }
        }
        
        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            if (panel.style.display === 'none' || !panel.style.display) {
                panel.style.display = 'block';
                loadAllData();
            } else {
                panel.style.display = 'none';
            }
        }
        
        async function addNewCode() {
            const newCode = document.getElementById('newCode').value;
            if (!newCode) {
                alert('الرجاء إدخال رمز جديد');
                return;
            }
            
            try {
                const response = await fetch('/add-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ newCode: newCode })
                });
                
                const result = await response.json();
                alert(result.message);
                
                if (result.success) {
                    document.getElementById('newCode').value = '';
                    loadCodes();
                }
            } catch (error) {
                alert('حدث خطأ في إضافة الرمز');
            }
        }
        
        async function loadCodes() {
            try {
                const response = await fetch('/get-codes');
                const data = await response.json();
                const codesList = document.getElementById('codesList');
                codesList.innerHTML = '<strong>الرموز المتاحة:</strong><br>' + data.codes.join(', ');
            } catch (error) {
                console.error('خطأ في تحميل الرموز:', error);
            }
        }
        
        async function loadContactsForAdmin() {
            try {
                const response = await fetch('/get-contacts');
                const data = await response.json();
                const contactsList = document.getElementById('contactsListAdmin');
                contactsList.innerHTML = '<strong>جهات الاتصال:</strong>';
                
                data.contacts.forEach(contact => {
                    const contactDiv = document.createElement('div');
                    contactDiv.className = 'contact-item-admin';
                    contactDiv.innerHTML = `
                        <span>${contact.name} (${contact.phone})</span>
                        <button class="delete-contact" onclick="deleteContact('${contact.id}')">حذف</button>
                    `;
                    contactsList.appendChild(contactDiv);
                });
            } catch (error) {
                console.error('خطأ في تحميل جهات الاتصال:', error);
            }
        }
        
        async function addNewContact() {
            const name = document.getElementById('newContactName').value;
            const phone = document.getElementById('newContactPhone').value;
            
            if (!name || !phone) {
                alert('الرجاء إدخال الاسم ورقم الهاتف');
                return;
            }
            
            try {
                const response = await fetch('/add-contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, phone: phone })
                });
                
                const result = await response.json();
                if (result.success) {
                    alert('تم إضافة جهة الاتصال بنجاح');
                    document.getElementById('newContactName').value = '';
                    document.getElementById('newContactPhone').value = '';
                    loadContactsForAdmin();
                } else {
                    alert(result.message || 'حدث خطأ');
                }
            } catch (error) {
                alert('حدث خطأ في إضافة جهة الاتصال');
            }
        }
        
        async function deleteContact(contactId) {
            if (!confirm('هل أنت متأكد من حذف هذه جهة الاتصال؟')) return;
            
            try {
                const response = await fetch('/delete-contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contactId: contactId })
                });
                
                const result = await response.json();
                if (result.success) {
                    alert('تم حذف جهة الاتصال بنجاح');
                    loadContactsForAdmin();
                } else {
                    alert(result.message || 'حدث خطأ');
                }
            } catch (error) {
                alert('حدث خطأ في حذف جهة الاتصال');
            }
        }
        
        async function loadAllData() {
            await loadCodes();
            await loadContactsForAdmin();
        }
        
        // التحقق من وجود صلاحية دخول سابقة
        if (sessionStorage.getItem('accessGranted') === 'true') {
            window.location.href = '/chat.html';
        }
    </script>
</body>
</html>
