async function loadContacts() {
    try {
        const r = await fetch('/get-contacts');
        const d = await r.json();
        allContacts = (d.contacts || []).filter(c => c.name !== currentUser.username);
        updateContactsList();
    } catch(e) { allContacts = []; }
}

function updateContactsList() {
    const term = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allContacts.filter(c =>
        c.name.toLowerCase().includes(term) || (c.phone||'').includes(term)
    );

    const list = document.getElementById('contactsList');
    list.innerHTML = '';

    if (!filtered.length) {
        list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-secondary)">لا توجد جهات اتصال</div>';
        return;
    }

    filtered.forEach(contact => {
        const unread = unreadMessages.get(contact.name) || 0;
        const div = document.createElement('div');
        div.className = `contact-item ${currentContact?.id === contact.id ? 'active' : ''}`;
        div.onclick = () => openChat(contact);
        div.innerHTML = `
            <div class="contact-avatar">${contact.avatar || contact.name.charAt(0).toUpperCase()}</div>
            <div class="contact-info">
                <div class="contact-name">${escHtml(contact.name)}</div>
                <div class="contact-phone">${contact.phone||''}</div>
                <div class="contact-status ${contact.status==='online'?'status-online':'status-offline'}">
                    ${contact.status==='online'?'● متصل':'○ غير متصل'}
                </div>
            </div>
            ${unread ? `<div class="unread-badge">${unread}</div>` : ''}
        `;
        list.appendChild(div);
    });
}

function filterContacts() { updateContactsList(); }

async function openChat(contact) {
    currentContact = contact;
    unreadMessages.delete(contact.name);
    updateContactsList();
    await loadConversation(contact);

    const chatArea = document.getElementById('chatArea');
    chatArea.innerHTML = `
        <div class="chat-header">
            <button class="back-btn" onclick="showSidebarOnMobile()">‹</button>
            <div class="chat-contact-avatar">${contact.avatar || contact.name.charAt(0).toUpperCase()}</div>
            <div class="chat-contact-info">
                <div class="chat-contact-name">${escHtml(contact.name)}</div>
                <div class="chat-contact-status ${contact.status==='online'?'status-online':'status-offline'}">
                    ${contact.status==='online'?'متصل الآن':'غير متصل'}
                </div>
            </div>
            <div class="chat-header-actions">
                <button class="chat-action-btn" onclick="startVideoCall()">📹 مكالمة</button>
            </div>
        </div>
        <div class="messages-container" id="messagesContainer"></div>
        <div class="input-area">
            <div class="input-buttons">
                <button class="attach-btn" title="إرفاق" onclick="triggerFileUpload()">📎</button>
                <button class="camera-btn" title="فيديو" onclick="captureVideo()">📹</button>
                <button class="mic-btn" title="صوت إلى نص" onclick="toggleVoiceToText()">🎙️</button>
                <button class="record-btn" title="تسجيل صوتي" onclick="toggleVoiceRecording()">🎤</button>
                <button class="send-voice-btn" id="sendVoiceBtn" title="إرسال التسجيل" onclick="sendVoiceRecording()">📤</button>
            </div>
            <div class="message-input-wrapper">
                <input type="text" class="message-input" id="messageInput"
                    placeholder="اكتب رسالتك..."
                    onkeypress="handleKeyPress(event)" oninput="onTyping()">
                <div class="typing-indicator" id="typingIndicator">✍️ جاري الكتابة...</div>
            </div>
            <button class="send-btn" onclick="sendMessage()">إرسال</button>
        </div>
    `;

    displayMessages();
    showChatOnMobile(contact);
}

function onTyping() {
    if (currentContact && socket) socket.emit('typing', { from: currentUser.username, to: currentContact.name });
}

function showTypingIndicator() {
    const el = document.getElementById('typingIndicator');
    if (el) el.classList.add('active');
}
function hideTypingIndicator() {
    const el = document.getElementById('typingIndicator');
    if (el) el.classList.remove('active');
}

async function loadConversation(contact) {
    try {
        const r = await fetch('/get-conversation', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: currentUser.username, contactId: contact.name })
        });
        const d = await r.json();
        window.currentMessages = d.messages || [];
    } catch(e) { window.currentMessages = []; }
}

function displayMessages() {
    const c = document.getElementById('messagesContainer');
    if (!c) return;
    c.innerHTML = '';
    (window.currentMessages || []).forEach(msg => {
        const sent = msg.from === currentUser.username;
        if      (msg.type === 'file')  addFileToChatUI(msg.from, msg.fileUrl, msg.fileName, msg.fileType, sent, msg.timestamp, msg.id);
        else if (msg.type === 'voice') addVoiceMessageToChatUI(msg.from, msg.audioUrl, msg.duration, sent, msg.timestamp, msg.id);
        else if (msg.type === 'video') addVideoToChatUI(msg.from, msg.videoUrl, sent, msg.timestamp, msg.id);
        else                           addMessageToChatUI(msg.from, msg.message, msg.timestamp, sent, msg.id, msg.read);
    });
    c.scrollTop = c.scrollHeight;
}

// ============================================================
// MESSAGE UI BUILDERS
// ============================================================
function fmtTime(ts) {
    return ts ? new Date(ts).toLocaleTimeString('ar-SA', { hour:'2-digit', minute:'2-digit' }) : '';
}

function addMessageToChatUI(sender, message, timestamp, isSent, messageId, isRead) {
    const c = document.getElementById('messagesContainer'); if (!c) return;
    const div = document.createElement('div');
    div.className = `message ${isSent?'sent':'received'}`;
    if (messageId) div.dataset.id = messageId;
    const readStatus = isSent ? `<span class="message-status">${isRead?'✓✓':'✓'}</span>` : '';
    const iconHtml = !isSent ? '<div class="message-icon"><span>💬</span></div>' : '';
    const md = { id:messageId, type:'text', message, from:sender };
    div.innerHTML = `
        <div class="message-bubble">
            ${iconHtml}
            <div class="message-text">${escHtml(message)}</div>
            <div class="message-time">${fmtTime(timestamp)} ${readStatus}</div>
        </div>
        <div class="message-menu" onclick="showMessageMenu(event, ${JSON.stringify(md).replace(/"/g,'&quot;')})">
            <div class="message-menu-dots">⋮</div>
        </div>`;
    c.appendChild(div);
    c.scrollTop = c.scrollHeight;
    if (!isSent && messageId && currentContact) markMessageAsRead(messageId, currentContact.name);
}

function addFileToChatUI(sender, fileUrl, fileName, fileType, isSent, timestamp, messageId) {
    const c = document.getElementById('messagesContainer'); if (!c) return;
    const div = document.createElement('div');
    div.className = `message ${isSent?'sent':'received'}`;
    if (messageId) div.dataset.id = messageId;
    const isImage = fileType?.startsWith('image/');
    const iconHtml = !isSent ? '<div class="message-icon"><span>📎</span></div>' : '';
    const readStatus = isSent ? '<span class="message-status">✓✓</span>' : '';
    const content = isImage
        ? `<div class="image-message"><img src="${fileUrl}" loading="lazy" onclick="window.open('${fileUrl}')" alt="${escHtml(fileName)}"></div>`
        : `<div class="file-message">
              <div class="file-icon">📄</div>
              <div class="file-info"><div class="file-name">${escHtml(fileName)}</div></div>
              <a href="${fileUrl}" download class="download-link">تحميل</a>
           </div>`;
    const md = { id:messageId, type:'file', fileUrl, fileName, fileType, from:sender };
    div.innerHTML = `
        <div class="message-bubble">${iconHtml}${content}
            <div class="message-time">${fmtTime(timestamp)} ${readStatus}</div>
        </div>
        <div class="message-menu" onclick="showMessageMenu(event, ${JSON.stringify(md).replace(/"/g,'&quot;')})">
            <div class="message-menu-dots">⋮</div>
        </div>`;
    c.appendChild(div); c.scrollTop = c.scrollHeight;
}

function addVideoToChatUI(sender, videoUrl, isSent, timestamp, messageId) {
    const c = document.getElementById('messagesContainer'); if (!c) return;
    const div = document.createElement('div');
    div.className = `message ${isSent?'sent':'received'}`;
    if (messageId) div.dataset.id = messageId;
    const iconHtml = !isSent ? '<div class="message-icon"><span>📹</span></div>' : '';
    const readStatus = isSent ? '<span class="message-status">✓✓</span>' : '';
    const md = { id:messageId, type:'video', videoUrl, from:sender };
    div.innerHTML = `
        <div class="message-bubble">${iconHtml}
            <div class="video-message">
                <video controls src="${videoUrl}" playsinline style="max-width:240px;max-height:240px;border-radius:10px"></video>
            </div>
            <div class="message-time">${fmtTime(timestamp)} ${readStatus}</div>
        </div>
        <div class="message-menu" onclick="showMessageMenu(event, ${JSON.stringify(md).replace(/"/g,'&quot;')})">
            <div class="message-menu-dots">⋮</div>
        </div>`;
    c.appendChild(div); c.scrollTop = c.scrollHeight;
}

function addVoiceMessageToChatUI(sender, audioUrl, duration, isSent, timestamp, messageId) {
    const c = document.getElementById('messagesContainer'); if (!c) return;
    const div = document.createElement('div');
    div.className = `message ${isSent?'sent':'received'}`;
    if (messageId) div.dataset.id = messageId;
    const iconHtml = !isSent ? '<div class="message-icon"><span>🎤</span></div>' : '';
    const readStatus = isSent ? '<span class="message-status">✓✓</span>' : '';
    const md = { id:messageId, type:'voice', audioUrl, duration, from:sender };
    div.innerHTML = `
        <div class="message-bubble">${iconHtml}
            <div class="voice-message">
                <div class="voice-icon">🎤</div>
                <div class="voice-player"><audio controls src="${audioUrl}" preload="none"></audio></div>
                <span style="font-size:11px">${Math.round(duration||0)} ث</span>
            </div>
            <div class="message-time">${fmtTime(timestamp)} ${readStatus}</div>
        </div>
        <div class="message-menu" onclick="showMessageMenu(event, ${JSON.stringify(md).replace(/"/g,'&quot;')})">
            <div class="message-menu-dots">⋮</div>
        </div>`;
    c.appendChild(div); c.scrollTop = c.scrollHeight;
}

// ============================================================
// SEND MESSAGE
// ============================================================
function sendMessage() {
    const input = document.getElementById('messageInput');
    const msg = input?.value.trim();
    if (!msg || !currentContact) return;
    const timestamp = new Date().toISOString();
    const messageId = uid();
    socket.emit('private message', { from: currentUser.username, to: currentContact.name, message: msg, timestamp, messageId });
    addMessageToChatUI(currentUser.username, msg, timestamp, true, messageId, true);
    if (!window.currentMessages) window.currentMessages = [];
    window.currentMessages.push({ from: currentUser.username, to: currentContact.name, message: msg, type:'text', timestamp, read:true, id: messageId });
    input.value = ''; 
    // Also clear accumulated transcript if any
    accumulatedTranscript = '';
}

function handleKeyPress(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

// ============================================================
// FILE UPLOAD
// ============================================================
async function uploadFile(file, onProgress) {
    for (const endpoint of uploadEndpoints) {
        try {
            const result = await uploadWithXHR(file, onProgress, endpoint);
            return result;
        } catch(e) { console.log('Upload failed on', endpoint, e.message); }
    }
    throw new Error('فشل الرفع');
}

function uploadWithXHR(file, onProgress, endpoint) {
    return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        const fd = new FormData();
        fd.append('file', file);
        fd.append('username', currentUser.username);
        fd.append('to', currentContact?.name || '');
        xhr.upload.addEventListener('progress', e => {
            if (e.lengthComputable && onProgress) onProgress(Math.round(e.loaded/e.total*100));
        });
        xhr.addEventListener('load', () => {
            if (xhr.status === 200) { try { resolve(JSON.parse(xhr.responseText)); } catch(e) { reject(e); } }
            else reject(new Error(`HTTP ${xhr.status}`));
        });
        xhr.addEventListener('error', () => reject(new Error('Network error')));
        xhr.open('POST', endpoint);
        xhr.timeout = 90000;
        xhr.send(fd);
    });
}

function showUploadProgress(show, status = '') {
    const p = document.getElementById('uploadProgress');
    if (p) p.style.display = show ? 'block' : 'none';
    const s = document.getElementById('uploadStatus');
    if (s) s.textContent = status;
}

function triggerFileUpload() {
    if (!currentContact) { showErrorNotification('اختر محادثة أولاً'); return; }
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*,application/pdf,.doc,.docx,.txt,video/*';
    inp.onchange = async (e) => {
        if (e.target.files?.[0]) {
            const f = e.target.files[0];
            f.type.startsWith('video/') ? await doUploadVideo(f) : await doUploadFile(f);
        }
    };
    inp.click();
}

function captureVideo() {
    if (!currentContact) { showErrorNotification('اختر محادثة أولاً'); return; }
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'video/*';
    inp.onchange = async (e) => { if (e.target.files?.[0]) await doUploadVideo(e.target.files[0]); };
    inp.click();
}

async function doUploadFile(file) {
    showUploadProgress(true, 'جاري الرفع...');
    try {
        const result = await uploadFile(file, p => { document.getElementById('uploadPercent').textContent = p; });
        showUploadProgress(false);
        if (result.success) {
            const id = uid();
            addFileToChatUI(currentUser.username, result.fileUrl, result.fileName, result.fileType, true, new Date().toISOString(), id);
            socket.emit('send file', { from: currentUser.username, to: currentContact.name, fileUrl: result.fileUrl, fileName: result.fileName, fileType: result.fileType, timestamp: new Date().toISOString() });
            showBeautifulNotification('✅ رُفع','تم رفع الملف','✅',2000);
        }
    } catch(e) { showUploadProgress(false); showErrorNotification('فشل رفع الملف'); }
}

async function doUploadVideo(file) {
    showUploadProgress(true, 'جاري رفع الفيديو...');
    try {
        const result = await uploadFile(file, p => { document.getElementById('uploadPercent').textContent = p; });
        showUploadProgress(false);
        if (result.success) {
            const id = uid();
            addVideoToChatUI(currentUser.username, result.fileUrl, true, new Date().toISOString(), id);
            socket.emit('send file', { from: currentUser.username, to: currentContact.name, fileUrl: result.fileUrl, fileName: result.fileName, fileType: 'video/mp4', timestamp: new Date().toISOString() });
            showBeautifulNotification('✅ رُفع','تم رفع الفيديو','✅',2000);
        }
    } catch(e) { showUploadProgress(false); showErrorNotification('فشل رفع الفيديو'); }
}

// ============================================================
// VOICE RECORDING
// ============================================================
function toggleVoiceRecording() { isRecording ? stopVoiceRecording() : startVoiceRecording(); }

function startVoiceRecording() {
    if (!currentContact) { showErrorNotification('اختر محادثة أولاً'); return; }
    audioChunks = []; recordingSeconds = 0;
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        recordingStream = stream;
        const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
        mediaRecorder = new MediaRecorder(stream, { mimeType });
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
            if (audioChunks.length) {
                currentAudioBlob = new Blob(audioChunks, { type: mimeType });
                currentAudioDuration = recordingSeconds;
                document.getElementById('sendVoiceBtn')?.classList.add('show');
                const rb = document.querySelector('.record-btn');
                if (rb) { rb.style.opacity = '0.5'; rb.disabled = true; }
                showBeautifulNotification('🎤 تسجيل','تم التسجيل، اضغط للإرسال','🎤',2000);
            }
            if (recordingStream) { recordingStream.getTracks().forEach(t => t.stop()); recordingStream = null; }
            clearInterval(recordingTimer);
            const td = document.getElementById('recordingTimer'); if (td) td.style.display = 'none';
        };
        mediaRecorder.start(100); isRecording = true;
        document.querySelector('.record-btn')?.classList.add('recording');
        const td = document.getElementById('recordingTimer'); if (td) td.style.display = 'block';
        recordingTimer = setInterval(() => {
            recordingSeconds++;
            const el = document.getElementById('timerSeconds'); if (el) el.textContent = recordingSeconds;
            if (recordingSeconds >= 60) stopVoiceRecording();
        }, 1000);
        showBeautifulNotification('🎤 تسجيل','بدأ التسجيل...','🎤',2000);
    }).catch(() => showErrorNotification('لا يمكن الوصول إلى الميكروفون'));
}

function stopVoiceRecording() {
    if (mediaRecorder && isRecording && mediaRecorder.state === 'recording') {
        mediaRecorder.stop(); isRecording = false;
        document.querySelector('.record-btn')?.classList.remove('recording');
    }
}

async function sendVoiceRecording() {
    if (!currentContact || !currentAudioBlob) return;
    if (currentAudioBlob.size > 10 * 1024 * 1024) { showErrorNotification('حجم التسجيل كبير جداً'); return; }
    showUploadProgress(true, 'جاري رفع التسجيل...');
    try {
        const ext = currentAudioBlob.type.includes('mp4') ? 'mp4' : 'webm';
        const file = new File([currentAudioBlob], `voice_${Date.now()}.${ext}`, { type: currentAudioBlob.type });
        const result = await uploadFile(file, p => { document.getElementById('uploadPercent').textContent = p; });
        showUploadProgress(false);
        if (result.success) {
            const id = uid();
            addVoiceMessageToChatUI(currentUser.username, result.fileUrl, currentAudioDuration, true, new Date().toISOString(), id);
            socket.emit('voice message', { from: currentUser.username, to: currentContact.name, audioUrl: result.fileUrl, duration: currentAudioDuration, timestamp: new Date().toISOString() });
            currentAudioBlob = null; currentAudioDuration = 0;
            document.getElementById('sendVoiceBtn')?.classList.remove('show');
            const rb = document.querySelector('.record-btn'); if (rb) { rb.style.opacity='1'; rb.disabled=false; }
            showBeautifulNotification('✅ أُرسل','تم إرسال التسجيل','✅',2000);
        }
    } catch(e) { showUploadProgress(false); showErrorNotification('فشل إرسال التسجيل'); }
}

// ============================================================
// UTILITIES
// ============================================================
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function escHtml(text) {
    if (!text) return '';
    const d = document.createElement('div'); d.textContent = text; return d.innerHTML;
}

function updateContactStatus(username, status) {
    const c = allContacts.find(c => c.name === username);
    if (c) { c.status = status; updateContactsList(); }
    if (currentContact?.name === username) {
        const el = document.querySelector('.chat-contact-status');
        if (el) { el.textContent = status==='online'?'متصل الآن':'غير متصل'; el.className = `chat-contact-status ${status==='online'?'status-online':'status-offline'}`; }
    }
}

function logout() {
    if (isRecording) stopVoiceRecording();
    if (isListening) stopVoiceToText();
    if (isInCall) endVideoCall();
    socket?.disconnect();
    sessionStorage.clear();
    window.location.href = '/index.html';
}

// ============================================================
// INIT
// ============================================================
function loadUserData() {
    if (sessionStorage.getItem('accessGranted') !== 'true') { window.location.href = '/index.html'; return; }
    currentUser = { username: sessionStorage.getItem('username'), userId: sessionStorage.getItem('username') };
    document.getElementById('userName').textContent = currentUser.username;
    document.getElementById('userAvatar').textContent = currentUser.username.charAt(0).toUpperCase();
    document.getElementById('userStatus').textContent = 'متصل';
    loadSettings();
    loadRingtoneSettings();
    loadAvailableRingtones();
    initializeSocket();
    loadContacts();
    initSpeechRecognition();
    setInterval(cleanupOldMessages, 3600000);
    showBeautifulNotification('👋 مرحباً', `أهلاً بك ${currentUser.username}`, '👋', 3000);
}

window.addEventListener('resize', () => {
    if (!isMobileView()) {
        document.getElementById('contactsSidebar').classList.remove('hidden');
        document.getElementById('chatArea').classList.remove('active');
        if (currentContact) document.getElementById('chatArea').style.display = '';
    }
});

window.addEventListener('beforeunload', e => {
    if (isInCall) { e.preventDefault(); e.returnValue = 'أنت في مكالمة فيديو. هل تريد المغادرة؟'; }
});

loadUserData();
</script>
